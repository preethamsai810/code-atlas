['Python','data, automation, AI, web back ends','python3 hello.py (Python 3.10+)',R`name = "Ana"

System.out.println(name + " lives in " + city);`],

int main(void) {

}`,'Ana is 20',R`C has no string type: char name[] is an array of characters. printf uses %s for text and %d for integers; #include <stdio.h> provides it. main returns 0 on success.`,R`printf("%d", name);`,'Use %s for text; %d expects an integer.',R`char city[] = "Pune";
printf("%s lives in %s\n", name, city);`],

int main() {

std::cout << name << " lives in " << city << "\n";`],

string name = "Ana";

Console.WriteLine($"{name} is {age}");`,'Ana is 20',R`Type name = value;. $"...{x}..." is string interpolation. Console.WriteLine prints. Top-level statements (C# 9+) replace the class/Main wrapper.`,R`int age = 20`,'Statements end with ;.',R`string city = "Pune";
Console.WriteLine($"{name} lives in {city}");`],
['TypeScript','large JavaScript projects with type checking','tsc hello.ts && node hello.js (or tsx hello.ts)',R`const who: string = "Ana";
let age: number = 20;

console.log(who + " lives in " + city);`],

['Rust','safe systems programming, WebAssembly, tools','cargo run (Rust 1.58+)',R`fn main() {

}`,'Ana is 20',R`let creates an immutable binding; let mut allows change. println! is a macro (note the !). {name} inline capture needs Rust 1.58+.`,R`let age = 20;
age = 21;`,'Bindings are immutable by default; write let mut age.',R`let city = "Pune";

['Swift','iOS and macOS apps','swift hello.swift',R`let name = "Ana"

print("\(name) lives in \(city)")`],

println("$name lives in $city")`],

echo "$name lives in $city\n";`],

age = 20
puts "#{name} is #{age}"`,'Ana is 20',R`No declaration keyword. "#{x}" inserts a value. puts prints with a newline.`,R`puts "#{name} is " + age`,'TypeError: use "#{age}" or age.to_s.',R`city = "Pune"
puts "#{name} lives in #{city}"`],

cat(name, "is", age, "\n")`,'Ana is 20',R`<- assigns a value (= also works). 20 is a numeric (double). cat() joins values with spaces and prints.`,R`Name <- "Ana"
cat(name)`,'R is case-sensitive: Name and name differ.',R`city <- "Pune"

fprintf("%s lives in %s\n", name, city);`],
['SQL','querying and changing relational databases','SQLite or PostgreSQL console (dialect: SQLite/PostgreSQL)',R`SELECT 'Ana' AS name, 20 AS age;`,'name | age\nAna  | 20',R`Standard SQL has no everyday variables: SELECT returns values as a result table. AS names a column. Text uses single quotes.`,R`SELECT "Ana";`,"Use single quotes for text: 'Ana'. Double quotes mean identifiers.",R`SELECT 'Ana' AS name, 'Pune' AS city;`],

['Haskell','functional programming, type-driven design','runghc hello.hs (GHC 9)',R`main :: IO ()

  putStrLn (name ++ " is " ++ show age)`,'Ana is 20',R`Values are immutable. let binds names inside do. ++ joins lists (a String is a list of Char); show turns a number into text. main :: IO () is the entry point.`,R`let name = "Ana"
let name = "Bo"   -- in one scope`,'Names cannot be rebound in one scope; pick a new name.',R`let city = "Pune"

const TH=[];
TH.push({d:["Think of the computer's memory as a huge wall of labelled boxes. A variable is one box with a name on it. When you create a variable, the computer reserves a box, puts your value inside, and remembers the name so you can find the box again.","Storing is different from printing. Storing keeps a value for later. Printing shows it on the screen. A program can store many values and print only a few. When a printed sentence contains a variable name inside special markers (this is called string interpolation or formatting), the language swaps the name for the value stored in the box.","Some languages want you to say what kind of value goes in the box (a whole number, text, and so on). Others work it out for you. Some let you change the contents later, and some lock the box. A locked box is called a constant. Locking values you do not plan to change prevents accidents."],t:[["Variable","a named box that holds a value"],["Value","the thing inside the box, such as 20 or the text Ana"],["Literal","a value typed directly into the code"],["Constant","a variable that cannot be changed after it is set"],["Output","what a program shows to the user"]],m:["A variable is not the same as its value: age is the name, 20 is what it holds.","= does not mean equals as in maths. It means: store the value on the right in the name on the left.","Printing a variable does not change it."],u:["Remembering a user's name after they type it.","Keeping a running score in a game.","Holding a price so you can reuse it in many places."],c:["Explain what a variable is in one sentence.","Create variables and print them in a sentence.","Tell the difference between a value and the variable that holds it.","Fix a program that prints the wrong value."]});
TH.push({d:["A program normally runs line by line from top to bottom. A conditional lets it choose a path. The computer asks a yes-or-no question, called a condition. If the answer is yes it runs one block of code. If the answer is no it can run a different block or skip it.","Conditions usually come from comparisons: greater than, less than, equal to. Be careful at the edges. age >= 18 includes 18, but age > 18 does not. Most beginner bugs in conditionals are edge mistakes, so always test the value exactly on the boundary.","You can chain choices: if this, else if that, else something different. The computer checks them in order and stops at the first one that is true. Only one branch ever runs."],t:[["Condition","a question whose answer is true or false"],["Boolean","the type with only two values: true and false"],["Branch","one of the paths a program can take"],["Comparison operator","a symbol like >, <, >= or == that compares two values"],["Else","the path taken when the condition is false"]],m:["One equals sign assigns a value; two or three compare. Mixing them up is a classic bug.","Both branches do not run: exactly one does.","In a chain, the first true condition wins, so order matters."],u:["Checking a password before logging someone in.","Choosing child or adult ticket prices.","Ending a game when health reaches zero."],c:["Write an if and else for a real rule.","Predict which branch runs for a given number.","Test the boundary values just below, on and above the limit.","Explain why = and == are different."]});
TH.push({d:["A loop repeats instructions. Instead of writing the same line 100 times, you write it once and tell the computer how many times, or until what happens, to repeat it.","Every loop has three ideas: where it starts, when it stops, and how it changes each round. If you forget the change, or the stop rule can never become true, you get an infinite loop that never ends.","Languages differ on whether the final number is included in a range. Some ranges stop one before the end value. Test a tiny case, such as counting to 3, before you trust a loop on large data."],t:[["Iteration","one pass through the loop"],["Counter","a variable that changes every round, such as n"],["Loop body","the instructions that repeat"],["Infinite loop","a loop that never stops"],["Off-by-one error","stopping one round too early or too late"]],m:["The loop variable is not magic. It is a normal variable that changes.","Counting from 1 to 4 prints 4 numbers, but the stop value in the code may be 4 or 5 depending on the language.","A loop does not always need a list. It can run until a condition changes."],u:["Showing every product in a shop.","Adding up a list of prices.","Repeating a game until the player quits."],c:["Write a loop that counts up.","Predict the last value printed.","Spot and fix an off-by-one mistake.","Explain how to avoid an infinite loop."]});
TH.push({d:["Operators are symbols that do work on values. Arithmetic operators do maths: add, subtract, multiply and divide. Comparison operators compare values. Logical operators such as and, or and not combine true and false answers.","Division has a trap. Dividing two whole numbers gives a whole number in some languages (7 / 2 is 3) and a decimal in others (3.5). The remainder operator, usually %, gives what is left over. It is handy for spotting even numbers: n % 2 is 0 when n is even.","When an expression has several operators, the language follows an order, just like in maths class: multiplication and division happen before addition and subtraction. Brackets always win, so add them whenever you are unsure."],t:[["Operand","a value an operator works on"],["Expression","code that produces a value, like 17 + 5"],["Remainder (modulo)","what is left over after dividing"],["Precedence","the order in which operators are applied"],["Integer division","dividing whole numbers and dropping the decimals"]],m:["17 % 5 is not a percentage. It is the remainder, which is 2.","Adding a number to text may join them instead of adding.","Computers store decimals approximately, so 0.1 + 0.2 may not be exactly 0.3."],u:["Working out totals and change in a shop.","Finding even and odd numbers.","Wrapping a clock back to 0 after 12 or 24."],c:["Calculate a sum and a remainder by hand.","Explain whole-number division.","Use brackets to control the order.","Predict the result of a short expression."]});
TH.push({d:["A function is a named recipe. You write the steps once, give them a name, and use that name whenever you need those steps. The values you hand to the function are its parameters, and the answer it hands back is its return value.","A function keeps its own private workspace. Variables created inside it exist only while it runs. This is called scope. It protects the rest of the program from accidents and lets you reuse the same variable names in different functions.","Good functions do one clear job and have a clear name. If you cannot describe what a function does in one sentence, it is probably doing too much and should be split in two."],t:[["Parameter","a named input of a function"],["Argument","the actual value you give when you call it"],["Return value","the result a function gives back"],["Call","using a function by its name"],["Scope","the part of the program where a name can be used"]],m:["Defining a function does not run it. You must call it.","Printing inside a function is not the same as returning a value.","Changing a parameter inside a function usually does not change the original variable outside."],u:["A tax function that is used on every price.","A greeting function for every user.","A function that checks whether a password is strong."],c:["Write a function with a parameter and a return value.","Explain the difference between defining and calling.","Say what scope means.","Split a long task into small functions."]});
TH.push({d:["Every value has a type. The type says what kind of thing it is and what you can do with it. You can add two numbers, but adding two pieces of text joins them. Types stop mistakes, such as multiplying a name by a price.","Data from the outside world, such as typing, files and websites, usually arrives as text, even when it looks like a number. Before doing maths you convert it: the text 42 becomes the number 42. Converting can fail, for example with abc, so good programs plan for that.","Some languages convert quietly for you. This is called implicit conversion. Others make you ask in the code, which is explicit conversion. Quiet conversion is convenient but can surprise you. Asking is safer and clearer."],t:[["Type","the kind of value, such as whole number, decimal or text"],["Conversion (casting)","changing a value from one type to another"],["Implicit conversion","the language converts automatically"],["Explicit conversion","you ask for the conversion in code"],["Parse","read text and turn it into another type"]],m:["The text 42 and the number 42 look alike but are different types.","Joining text and a number may give 428 instead of 50.","Converting bad text can crash the program, so always check."],u:["Reading a number typed into a form.","Showing a price as text with a currency sign.","Reading numbers from a file."],c:["Convert text to a number and back.","Explain implicit versus explicit conversion.","Predict what happens when text and a number are added.","Handle a conversion that fails."]});
TH.push({d:["Errors are normal and there are three kinds. Syntax errors break the rules of the language, so the program will not even start. Runtime errors happen while the program is running, such as turning abc into a number. Logic errors are the sneakiest: the program runs fine but gives a wrong answer.","Debugging is detective work. First make the problem happen again. Then narrow it down: which line? Print values to see what is really stored. Read the error message from the top, because it usually names the problem and the line. Change one thing at a time and test again.","Handling errors means planning for what can go wrong. You try something risky, and if it fails you do something sensible instead of crashing. A friendly message is better than a crash."],t:[["Syntax error","code that breaks the language rules"],["Runtime error","a failure while the program runs"],["Logic error","the program runs but gives wrong results"],["Debugging","finding and fixing the cause of a problem"],["Error handling","planning what to do when something fails"]],m:["Error messages are not insults. They are clues.","Fixing the symptom is not the same as fixing the cause.","Catching every error silently hides bugs. Handle the ones you expect."],u:["Showing Please enter a number instead of crashing.","Retrying a failed network request.","Recording problems in a log so they can be fixed."],c:["Tell the three kinds of error apart.","Read an error message and find the line.","Use printing to inspect values.","Handle a failure without crashing."]});
TH.push({d:["A list stores many values under one name, in order. Each item has a position number called an index. Most languages start counting at 0, so the first item is index 0. A few, such as R, MATLAB and Lua, start at 1.","Common jobs with lists are: ask how many items there are, read one item by its position, add an item, remove an item, and loop through all of them. Asking for a position that does not exist is the most common list mistake.","Some lists can grow and change. Others are fixed or read-only. Choosing the right kind keeps programs safe and fast."],t:[["Index","the position number of an item"],["Element (item)","one value in a list"],["Length (size)","how many items there are"],["Out of range","asking for a position that does not exist"],["Mutable","can be changed after it is created"]],m:["In a 0-based language the last index is the length minus one.","Copying a list variable may share the same list instead of making a new one.","A list is not a map: a list is looked up by position, a map by key."],u:["A shopping basket.","High scores in a game.","Names on an attendance sheet."],c:["Create a list and read any item.","Say whether your language starts counting at 0 or 1.","Add and remove items.","Avoid out-of-range mistakes."]});
TH.push({d:["A map, also called a dictionary or hash, stores pairs. Each pair has a key, which is what you search by, and a value, which is what you get back. Keys are unique: adding the same key twice usually replaces the older value.","Maps shine when you look something up by name instead of position. Finding the age of Mia in a list means checking item after item. A map jumps straight to the answer. That speed is why maps are everywhere.","Asking for a key that is missing is the main danger. Depending on the language you get an error, an empty value or a default. Check first, or supply a default."],t:[["Key","the label you look things up by"],["Value","the data stored under a key"],["Pair","one key together with its value"],["Lookup","fetching a value by its key"],["Hash map","a map that finds keys very quickly"]],m:["Keys must be unique.","Maps are not always kept in the order you added the items.","A missing key is not the same as a key whose value is zero."],u:["Phone books and contact lists.","Counting how often each word appears.","Settings such as language and theme."],c:["Create a map and look up a value.","Explain why keys must be unique.","Handle a missing key safely.","Choose between a list and a map."]});
TH.push({d:["Nobody writes everything from scratch. A module, also called a library or package, is a bundle of ready-made code. An import line brings it into your program so you can use its tools by name.","Some tools are built into the language and need no import. Others live in modules that you load first. Large programs are split into modules of their own, so each file has one purpose and is easy to find and reuse.","Libraries from other people usually need installing first with a package manager, and they come in versions. Note the version you tested with, so a later update does not break your program."],t:[["Module","a file or bundle of related code"],["Library","a collection of code written by someone else"],["Import","a line that makes a module available"],["Package manager","a tool that downloads and updates libraries"],["Namespace","the prefix that shows where a name comes from, such as math.ceil"]],m:["Importing does not run your own logic. It only makes names available.","In some languages an unused import stops the program from compiling.","Two modules can have a function with the same name, so prefixes keep them apart."],u:["Using maths or date tools.","Splitting a big app into files.","Adding a charting library."],c:["Import a module and use one of its tools.","Explain built-in tools versus imported ones.","Fix a name-not-found error caused by a missing import.","Say what a package manager does."]});
TH.push({d:["Variables disappear when a program ends. Files keep data on disk. Writing puts data into a file and reading brings it back. This is how settings, notes, scores and documents survive from one run to the next.","The steps are always similar: open the file, read or write, then close it. Many languages close it for you when you use a special block. Files can be missing, locked or full, so reading and writing can fail, and good programs handle that.","Text files hold readable characters. Other formats, such as images and spreadsheets, are binary and need special tools. The path tells the computer where the file is. A short path like note.txt means the current folder."],t:[["Path","the location of a file"],["Open and close","start and finish using a file"],["Read","bring the file's contents into the program"],["Write","save program data into the file"],["Encoding","how characters are stored as bytes, usually UTF-8"]],m:["Writing to a file replaces its old contents unless you use append mode.","Forgetting to close a file can lose data.","A file that exists on your computer may not exist on someone else's."],u:["Saving a to-do list.","Reading a list of names to process.","Writing a log of what happened."],c:["Write text to a file and read it back.","Explain why files are needed.","Handle a missing file.","Say what a path is."]});

TH.push({d:["So far, errors just happened to you. Raising an error (some languages say throwing) lets your own code refuse a bad situation on purpose. When a function receives something it cannot sensibly work with, such as an age of minus five, it stops and reports a clear problem instead of carrying on with nonsense.","A raised error travels upward to whoever called the function. If that caller has a safety net (a try block with a catch or except part) the error is caught and handled. If nobody catches it, the program stops and shows the error. Languages differ: many use exceptions that fly upward, while Go and Rust return the error as an ordinary value that you must check.","Good error messages say what went wrong and, where possible, how to fix it. Age cannot be negative is better than Invalid. Choose a specific error type when the language offers one, so callers can handle different problems in different ways."],t:[["Raise (throw)","create an error on purpose"],["Catch","handle an error so the program can carry on"],["Exception","an error object that travels up to the caller"],["Error message","the text that explains the problem"],["Result or return code","reporting a problem through a returned value instead of throwing"]],m:["Raising an error is not the same as printing a message.","A catch block that does nothing hides the bug.","Not every language has exceptions. Checking returned errors is just as valid."],u:["Rejecting an impossible age or price.","Stopping a payment when there is not enough money.","Telling a caller that a required file is missing."],c:["Raise an error for bad input.","Catch it and show a helpful message.","Explain how your language reports errors, by exceptions or by returned values.","Write a clear error message."]});
TH.push({d:["Recursion means a function solves a problem by calling itself on a smaller version of the same problem. To find 5 factorial, the function asks for 4 factorial and multiplies by 5. That asks for 3 factorial, and so on, until the problem is so small that the answer is known.","Two parts are essential. The base case is the smallest problem, which you answer directly (the factorial of 1 is 1). The recursive case makes the problem smaller and calls the function again. Without a base case, or with a step that does not shrink the problem, the function calls itself forever until the computer runs out of space. That is called a stack overflow.","Each call waits on the call stack, a pile of paused calls. When the base case answers, the pile unwinds and every waiting call finishes. Recursion suits problems that contain smaller copies of themselves, such as folders inside folders. A loop is often simpler and faster for plain counting, so choose the clearer tool."],t:[["Recursive case","the part that calls the function again on a smaller problem"],["Base case","the smallest problem, answered directly"],["Call stack","the pile of calls that are waiting"],["Stack overflow","running out of space because of too many calls"],["Factorial","a number multiplied by every whole number below it, down to 1"]],m:["Each call gets its own copy of the variables.","A missing base case means an endless chain of calls.","Recursion is not automatically faster than a loop."],u:["Walking through folders inside folders.","Solving puzzles such as the Tower of Hanoi.","Processing nested data like a family tree."],c:["Name the base case and the recursive case in a function.","Trace a recursive call by hand.","Explain what a stack overflow is.","Decide when a loop is the better choice."]});
TH.push({d:["A test is a tiny program that checks your code. You call a function with an input whose answer you already know and compare the real result with the expected one. If they match, the test passes. If not, it fails, and you found a bug before a user did.","Good tests are small, fast and clear about what they check. Test the normal case, then the edges: zero, negative numbers, empty lists and the exact limit of a rule. Many bugs live at the edges. When you fix a bug, add a test for it, so it can never quietly return.","Real projects use a testing tool for each language. It finds all your tests, runs them in one go and prints a summary. The idea is the same as the PASS and FAIL example here: known input, expected output, automatic comparison."],t:[["Test","code that checks other code"],["Expected value","the answer you know is correct"],["Assertion","a check that fails when the result is wrong"],["Edge case","an unusual input at the limit of the rules"],["Regression","an old bug that comes back"]],m:["A passing test does not prove there are no bugs. It only shows that this case works.","Tests should not depend on each other.","Testing is not wasted time. It saves debugging time later."],u:["Checking a price calculator after every change.","Making sure a bug fix stays fixed.","Letting a team change code safely."],c:["Write a pass-or-fail check for a function.","Pick an edge case worth testing.","Explain expected value versus actual value.","Say what testing tool your language uses."]});
TH.push({d:["Searching means finding one item among many. Linear search is the simplest method: start at the first item, compare it with the target, then move to the next, until you find it or run out of items. It works on any list, even an unsorted one.","The cost of linear search grows with the list. Finding something among 10 items takes at most 10 checks. Among a million items it can take a million. If the list is sorted, binary search is far faster: it checks the middle item, throws away the half that cannot contain the target, and repeats. A million items need only about 20 checks.","Always decide what to return when nothing is found. Common choices are 0, -1, null or an optional value. Pick one, write it down and check for it, or your program may treat not found as if it were a real position."],t:[["Target","the item you are looking for"],["Linear search","checking items one by one"],["Binary search","repeatedly halving a sorted list"],["Not found","the result when nothing matches"],["Position (index)","where the item was found"]],m:["Binary search only works on a sorted list.","The first match is returned, even if the target appears again later.","Not found is a valid result, not an error."],u:["Finding a contact in a phone.","Checking whether a username is taken.","Looking up a product code."],c:["Write a linear search.","Explain what happens when nothing matches.","Say why binary search needs a sorted list.","Decide what your code returns for not found."]});
TH.push({d:["Sorting puts items in order, such as numbers from smallest to largest or names from A to Z. Almost every language has a built-in sort. Use it: it is fast, well tested and clear.","Some sorts change the original list in place. Others return a new sorted list and leave the original alone. Knowing which one you have prevents surprises. Numbers stored as text sort differently from real numbers: as text, 10 comes before 9, because the first character 1 is smaller than 9.","You can tell a sort how to compare items: by length, by date, by price, or from largest to smallest. You do this by giving the sort a small comparing function or a key. Sorting by several things at once, for example by city and then by name, works the same way."],t:[["Ascending","smallest to largest"],["Descending","largest to smallest"],["In place","changing the original list"],["Comparator","a function that says which of two items comes first"],["Stable sort","items that tie keep their original order"]],m:["Some sort functions return nothing, so printing their result shows an empty value.","Sorting text and sorting numbers are different.","Sorting does not remove duplicates."],u:["Leaderboards.","Showing the cheapest products first.","Putting emails in date order."],c:["Sort a list in both directions.","Say whether your language sorts in place.","Explain why numbers stored as text sort strangely.","Sort by a custom rule."]});
TH.push({d:["A stack and a queue are both lists with strict rules about where items go in and come out. A stack is last in, first out, like a pile of plates: you add to the top and take from the top. A queue is first in, first out, like a line at a shop: you join at the back and are served from the front.","Stacks power the undo button, the back button in a browser and even the way functions call each other. Queues organise print jobs, customers waiting for support and tasks that must be handled in order of arrival.","Most languages let a plain list act as either one. For a queue, removing from the front of a simple list can be slow, because every item shifts along. So many languages provide a special queue type, often called a deque, that does it quickly."],t:[["Stack","last in, first out (LIFO)"],["Queue","first in, first out (FIFO)"],["Push","add to the top of a stack"],["Pop","remove from the top of a stack"],["Enqueue and dequeue","add to the back and remove from the front of a queue"]],m:["A stack and a queue can hold the same data. Only the order of removal differs.","Popping an empty stack is an error.","A queue is not the same as a sorted list."],u:["Undo and redo.","Print queues.","Checking that brackets in code match."],c:["Explain LIFO and FIFO with a real example.","Push and pop items on a stack.","Add to and remove from a queue.","Say which one suits an undo feature."]});
TH.push({d:["A class is a blueprint. It describes what every thing of one kind has (its data, called fields or properties) and what it can do (its actions, called methods). An object, also called an instance, is one real thing built from the blueprint. Many Person objects can exist, each with its own name and age.","A constructor is the special step that builds an object and sets its starting values. Methods can read and change the object's own data. Keeping data and the actions that use it together makes large programs easier to understand.","Not every language uses classes. C and Go use structs plus functions, Rust uses structs with impl blocks, Haskell uses record types, and SQL uses tables with rows. The idea of grouping related data and behaviour appears in all of them."],t:[["Class","a blueprint for objects"],["Object (instance)","one thing built from a class"],["Field (property)","a value stored inside an object"],["Method","a function that belongs to an object"],["Constructor","code that creates and sets up a new object"]],m:["A class is not an object. It is the plan, and the object is the building.","Two objects from the same class do not share their field values.","Classes are one way to organise code, not the only way."],u:["Users, orders and products in a shop.","Characters in a game.","Bank accounts with a balance."],c:["Explain the difference between a class and an object.","Build two objects with different values.","Add a method that uses the fields.","Name how your language groups data and behaviour."]});
TH.push({d:["Instead of writing a loop for every small job, you can describe the job. Filter says: keep only the items that pass this test. Map says: change every item using this rule. Because they take a function as input, they are called higher-order functions.","They chain naturally. Filter the even numbers, then map each one to its double, then join the results. Read the chain from left to right like a recipe. Order matters: doubling before filtering for even numbers would keep everything, because every doubled number is even.","Some languages produce the result at once, and others produce it lazily, only when you ask for it. Lazy results may need a final step such as collect, toList or join. Remember that map and filter build new results. They do not change the original list."],t:[["Higher-order function","a function that takes or returns another function"],["Filter","keeps the items that pass a test"],["Map","changes every item"],["Lambda (closure)","a short unnamed function"],["Lazy","not calculated until it is needed"]],m:["Map does not remove items, and filter does not change them.","The test given to filter must give true or false.","Chains are read in order, so a different order may give a different answer."],u:["Keeping only products in stock, then adding tax.","Cleaning a list of names.","Turning a list of prices into text for display."],c:["Use filter to keep items that pass a test.","Use map to change every item.","Chain them in the right order.","Explain what a lambda is."]});
TH.push({d:["Text is a sequence of characters. Almost every program handles text: names, messages, file contents, web pages. Languages give you tools to change case, measure length, search inside text, replace parts, split it into pieces and join pieces back together.","In most languages a string cannot be changed in place. Every tool returns a new string, so you must save the result if you want to keep it. Length can also surprise you: some languages count bytes and others count characters, and a letter such as e with an accent may take more than one byte.","Real text has traps: capital letters, extra spaces, different languages and symbols. Before comparing two strings, clean them the same way, for example by trimming spaces and converting to lowercase."],t:[["String","a piece of text"],["Character","one letter, digit or symbol"],["Substring","a part of a string"],["Split and join","break text into pieces and glue pieces together"],["Unicode (UTF-8)","the standard that lets computers store every language"]],m:["Calling upper on a string does not change the original.","The length in bytes may differ from the number of characters.","Two strings that look the same may differ in capitals or spaces."],u:["Cleaning a username before saving it.","Searching messages for a word.","Formatting names in capitals for a label."],c:["Change the case of a string.","Count its characters.","Explain why the original text is unchanged.","Say what to do before comparing two strings."]});
TH.push({d:["Never trust input. It may come from a user, a file or another computer, and it can be wrong, missing or even hostile. Validation means checking input against your rules before using it: is it present, the right type, the right length and inside the allowed range?","Many famous attacks are just missing validation. SQL injection happens when input is pasted into a database command, so the attacker can add commands of their own. The fix is to send input as separate parameters, never glued into the command. Showing input in a web page without cleaning it lets attackers run scripts. Running input as code is the most dangerous mistake of all.","Validate on the side you control, usually the server or the program itself, since checks in a web form can be bypassed. Reject bad input with a clear message, and never store passwords as plain text. Store a salted hash instead."],t:[["Validation","checking input against rules"],["Sanitising","cleaning input so it is safe to use"],["Injection","tricking a program into running attacker commands"],["Parameter (placeholder)","a safe way to pass input into a query"],["Hash","a one-way scrambled form of a password"]],m:["Checking only in the browser is not enough.","A long password rule does not protect against injection.","Hiding errors does not make a program secure."],u:["Checking an email address and password length.","Protecting a database from injection.","Making sure a number is in a sensible range."],c:["Write a length check for input.","Explain what injection is.","Say why input must never run as code.","Describe how to pass input safely into a query."]});
TH.push({d:["A capstone project brings many ideas together in one working program. The grade report uses a list to hold data, a loop to add it up, arithmetic to find an average, a condition to pick Pass or Fail, and a function to wrap it all into one reusable tool.","Build it in small milestones and test after each one. First store the data and print it. Next add the loop and print the total. Then divide and print the average. Then add the decision. Finally move the code into a function. If a step breaks, you know exactly where the problem is.","When it works, improve it: handle an empty list, reject negative scores, print the highest score, read the scores from a file, and add tests. These extra steps turn a classroom example into something you could show in a portfolio."],t:[["Milestone","a small step with a visible result"],["Decomposition","breaking a big problem into small ones"],["Refactoring","tidying code without changing what it does"],["Portfolio","a collection of finished projects you can show"],["Edge case","an unusual input that can break the program"]],m:["Writing everything at once is slower than building in steps.","A project is finished when it handles bad input, not only good input.","Copying a solution teaches less than rebuilding it yourself."],u:["A school marks calculator.","A budget tracker.","A small game score board."],c:["Break a project into milestones.","Test after every step.","Handle at least one edge case.","Explain your finished program to someone else."]});

/* ===== Supabase integration =====
   Replaces the old local profile + Claude-account storage. Functions below are declared
   later in the file than the old ones, so these versions are the ones that run. */
const CFG=window.ATLAS_CONFIG||{};
let sb=null,UID=null,SNAP=null,LOADED=false,SYNCING=false,PEND=false,SYNCFAIL=false,stT;
try{if(CFG.SUPABASE_URL&&CFG.SUPABASE_PUBLISHABLE_KEY&&!/PASTE_YOUR|service_role|^sb_secret_/.test(CFG.SUPABASE_PUBLISHABLE_KEY)&&window.supabase)sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}})}catch(e){}
const LN=i=>D[i].n,LI=n=>D.findIndex(d=>d.n==n);
const emptyS=()=>({done:{},bm:{},quiz:{},tests:{},name:'',last:null,ts:0});
const clone=o=>JSON.parse(JSON.stringify(o));
const lk=()=>'atlas_local_'+UID;
const kp=k=>{const [i,c]=k.split(':').map(Number);return{language:LN(i),concept:c}};
function cacheLocal(dirty){try{localStorage.setItem(lk(),JSON.stringify({S,dirty}))}catch(e){}}
function save(){if(ADM||!UID)return;S.ts=Date.now();cacheLocal(true);clearTimeout(stT);stT=setTimeout(push,500)}
async function push(){
if(!sb||!UID||!LOADED)return;
if(SYNCING){PEND=true;return}
SYNCING=true;PEND=false;setSt('Saving…');
const cur=clone(S),base=SNAP||emptyS(),u=UID,ops=[];
try{
const done=Object.keys(cur.done).filter(k=>cur.done[k]&&!base.done[k]).map(k=>({user_id:u,...kp(k)}));
if(done.length)ops.push(sb.from('completed_lessons').upsert(done,{onConflict:'user_id,language,concept'}));
const bmAdd=Object.keys(cur.bm).filter(k=>cur.bm[k]&&!base.bm[k]).map(k=>({user_id:u,...kp(k)}));
if(bmAdd.length)ops.push(sb.from('bookmarks').upsert(bmAdd,{onConflict:'user_id,language,concept'}));
Object.keys(base.bm).filter(k=>base.bm[k]&&!cur.bm[k]).forEach(k=>{const p=kp(k);ops.push(sb.from('bookmarks').delete().eq('user_id',u).eq('language',p.language).eq('concept',p.concept))});
const qz=Object.keys(cur.quiz).filter(k=>JSON.stringify(cur.quiz[k])!=JSON.stringify(base.quiz[k])).map(k=>({user_id:u,...kp(k),passed:!!cur.quiz[k].ok,tries:cur.quiz[k].tries||0}));
if(qz.length)ops.push(sb.from('quiz_results').upsert(qz,{onConflict:'user_id,language,concept'}));
const ts=Object.keys(cur.tests).filter(i=>JSON.stringify(cur.tests[i])!=JSON.stringify(base.tests[i])).map(i=>({user_id:u,language:LN(+i),best:cur.tests[i].best,attempts:cur.tests[i].attempts,last_score:cur.tests[i].last}));
if(ts.length)ops.push(sb.from('test_results').upsert(ts,{onConflict:'user_id,language'}));
if(cur.name!==base.name||JSON.stringify(cur.last)!==JSON.stringify(base.last))ops.push(sb.from('profiles').update({display_name:cur.name||null,last_language:cur.last?LN(cur.last.i):null,last_concept:cur.last?cur.last.c:null}).eq('id',u));
const res=await Promise.all(ops),err=res.map(r=>r&&r.error).find(Boolean);
if(err)throw err;
SNAP=cur;SYNCFAIL=false;cacheLocal(JSON.stringify(S)!=JSON.stringify(cur));
setSt('All progress saved to your account');
}catch(e){SYNCFAIL=true;setSt('Could not save to Supabase ('+esc2(e&&e.message||String(e))+'). Your progress is kept on this device. <button onclick="push()">Retry</button>')}
SYNCING=false;if(PEND)push()}
async function loadRemote(){
const q=t=>sb.from(t).select('*').eq(t=='profiles'?'id':'user_id',UID);
const [p,c,qz,b,t]=await Promise.all([q('profiles').maybeSingle(),q('completed_lessons'),q('quiz_results'),q('bookmarks'),q('test_results')]);
const err=[p,c,qz,b,t].map(r=>r.error).find(Boolean);if(err)throw err;
const R=emptyS();
if(p.data){R.name=p.data.display_name||'';const li=LI(p.data.last_language);if(li>=0&&p.data.last_concept!=null)R.last={i:li,c:p.data.last_concept}}
c.data.forEach(r=>{const i=LI(r.language);if(i>=0)R.done[i+':'+r.concept]=true});
qz.data.forEach(r=>{const i=LI(r.language);if(i>=0)R.quiz[i+':'+r.concept]={ok:r.passed,tries:r.tries}});
b.data.forEach(r=>{const i=LI(r.language);if(i>=0)R.bm[i+':'+r.concept]=true});
t.data.forEach(r=>{const i=LI(r.language);if(i>=0)R.tests[i]={best:r.best,attempts:r.attempts,last:r.last_score}});
return R}
async function onSignedIn(user){
UID=user.id;LOADED=false;S=emptyS();setSt('Loading your progress…');
let local=null;try{local=JSON.parse(localStorage.getItem(lk())||'null')}catch(e){}
try{
const R=await loadRemote();SNAP=clone(R);S=clone(R);LOADED=true;
if(local&&local.dirty&&local.S){const before=JSON.stringify(S);merge(local.S);norm();if(JSON.stringify(S)!==before)push()}
cacheLocal(false);setSt('Signed in. Progress synced.');
}catch(e){
if(local&&local.S){S=Object.assign(emptyS(),local.S);norm()}
setSt('Could not load your saved progress ('+esc2(e&&e.message||String(e))+'). Nothing has been overwritten. <button onclick="onSignedIn({id:UID})">Retry</button>')}
AUTH='ok';V={v:'home'};render()}
